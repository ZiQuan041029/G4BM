name: g4bm
description: "An AI-powered mental wellness application."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  image_picker: ^1.2.1
  http: ^1.6.0
  http_parser: ^4.0.2
  intl: ^0.20.2
  location: ^5.0.3
  permission_handler: ^11.1.0
  url_launcher: ^6.2.3
  shared_preferences: ^2.5.4
  share_plus: ^12.0.1
  audioplayers: ^6.6.0
  flutter_sound: ^9.3.0
  record: ^4.0.2  
  webview_flutter: ^4.7.0
  path_provider: ^2.0.15 
  fl_chart: ^0.70.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/G4BM_logo.png
    - assets/gender/
    - assets/emotions/
    - assets/BZCoin.png
    - assets/default_user_pp.png
    - assets/audio/